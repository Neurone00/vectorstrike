<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>SV Controller</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #15171a; color: #e8e2d2; font: 14px/1.3 system-ui, sans-serif; }
  #app { display: grid; width: 100vw; overflow: hidden; height: 100dvh; grid-template-rows: auto 1fr; gap: 8px; padding: 8px; padding-top: max(8px, env(safe-area-inset-top)); }
  .row { display: flex; gap: 8px; }
  button { flex: 1; min-width: 0; min-height: 56px; border: 2px solid #3a3f45; border-radius: 10px; background: #23272c; color: inherit; font: inherit; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  button.on { border-color: #17e6ff; background: #0f3a40; color: #9ff5ff; box-shadow: 0 0 14px #17e6ff88; }
  #dbg { font: 11px/1.4 ui-monospace, monospace; color: #b09a52; white-space: pre-wrap; word-break: break-all; overflow: hidden; height: 7.5em; margin-top: 6px; }
  #dbg.off { color: #d44; }
  #main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 72px; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 0; }
  .zone { display: flex; text-align: center; align-items: center; justify-content: center; border: 2px dashed #3a3f45; border-radius: 14px; font-weight: 900; font-size: 20px; text-transform: uppercase; color: #777; }
  .zone.on { border-style: solid; border-color: #17e6ff; color: #9ff5ff; background: #0f3a40; box-shadow: inset 0 0 30px #17e6ff44; }
  #abL { grid-column: 1; grid-row: 1 / 3; } #abR { grid-column: 3; grid-row: 1 / 3; } #boost { grid-column: 2; grid-row: 1; } #pulse { grid-column: 2; grid-row: 2; }
  #boost { background: #2b2214; } #pulse { background: #1a1e2b; }
  #thr { grid-column: 4; grid-row: 1 / 3; position: relative; border: 2px solid #3a3f45; border-radius: 14px; background: #1c1f23; overflow: hidden; }
  #thrFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(#17e6ff, #0f7f8c); }
  #thrVal { position: absolute; left: 0; right: 0; top: 8px; text-align: center; font-weight: 900; color: #e8e2d2; mix-blend-mode: difference; }
  @media (orientation: landscape) {
    .bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bar .row { margin-top: 0 !important; }
    #dbg { grid-column: 1 / 3; height: 3em; font-size: 10px; }
    button { min-height: 44px; }
    #main { grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 90px; grid-template-rows: 1fr; }
    #abL, #abR, #boost, #pulse, #thr { grid-row: 1; }
    #abL { grid-column: 1; } #boost { grid-column: 2; } #pulse { grid-column: 3; } #abR { grid-column: 4; } #thr { grid-column: 5; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="row">
      <input id="host" placeholder="mac ip:8080" inputmode="decimal" style="display:none;flex:1.6;min-width:0;min-height:56px;border:2px solid #3a3f45;border-radius:10px;background:#23272c;color:inherit;font:inherit;padding:0 10px">
      <button id="start">Start</button>
      <button id="cal">Calibrate</button>
      <button id="mode">Auto</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="line on" data-line="0">Line 1</button>
      <button class="line" data-line="1">Line 2</button>
      <button class="line" data-line="2">Line 3</button>
    </div>
    <div id="dbg" class="off">tap START</div>
  </div>
  <div id="main">
    <div id="abL" class="zone">Air<br>brake L</div>
    <div id="boost" class="zone">Boost</div>
    <div id="pulse" class="zone">Pulse</div>
    <div id="abR" class="zone">Air<br>brake R</div>
    <div id="thr"><div id="thrFill"></div><div id="thrVal">0%</div></div>
  </div>
</div>
<script>
'use strict';
const DEADZONE = 3, FULL_LOCK = 30;   // degrees; tune on the real phone
const $ = (id) => document.getElementById(id);
const state = { t: 0, steer: 0, throttle: 0, abL: false, abR: false, boost: false, pulse: false, mode: 'auto', line: 0 };
let tilt = 0, zero = 0, haveOrientation = false, rawEvents = 0, nullEvents = 0, started = false;

// --- WebSocket with reconnect ---
const APP = location.protocol === 'file:';           // running inside the Android shell
if (APP) { $('host').style.display = ''; try { $('host').value = localStorage.sv_host || ''; } catch {} }
function wsUrl() {
  if (!APP) return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
  const h = $('host').value.trim(); return h ? `ws://${h.includes(':') ? h : h + ':8080'}` : null;
}
let ws = null;
function connect() {
  const url = wsUrl(); if (!url) return;
  if (ws && ws.readyState <= 1 && ws.url === url) return;
  if (ws) { ws.onclose = null; ws.close(); }
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({ role: 'phone' }));
  ws.onclose = () => setTimeout(connect, 1000);
  ws.onerror = () => ws.close();
}
connect();
if (APP) setInterval(connect, 2000);   // retry until a host is entered

// --- Orientation ---
function applyTilt(gamma, beta) {
  haveOrientation = true;
  // portrait: gamma is left/right roll; landscape: beta is.
  const land = (screen.orientation ? screen.orientation.type : '').startsWith('landscape');
  tilt = land ? beta : gamma; // ponytail: gamma wraps past vertical; hold the phone flatter than 90°
  const a = tilt - zero, m = Math.abs(a);
  state.steer = m < DEADZONE ? 0 : Math.sign(a) * Math.min(1, (m - DEADZONE) / (FULL_LOCK - DEADZONE));
}
function onOrient(e) {
  rawEvents++;
  if (e.gamma == null) { nullEvents++; return; }
  applyTilt(e.gamma, e.beta);
}
window.nativeTilt = (deg) => { rawEvents++; applyTilt(deg, deg); };  // Android shell: steering angle, landscape frame
$('start').onclick = async () => {
  if (APP) { try { localStorage.sv_host = $('host').value.trim(); } catch {} connect(); started = true; $('start').classList.add('on'); $('start').textContent = 'Live'; return; }
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') throw new Error('denied');
    }
    window.addEventListener('deviceorientation', onOrient);
    started = true;
    $('start').classList.add('on'); $('start').textContent = 'Live';
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  } catch (err) { lastErr = 'start: ' + err.message; $('dbg').textContent = 'orientation error: ' + err.message; }
};
$('cal').onclick = () => { zero = tilt; };
// Chrome exposes the motion-sensor site setting through the Permissions API.
let perm = '?';
if (navigator.permissions) Promise.all(['accelerometer', 'gyroscope'].map((n) => navigator.permissions.query({ name: n }).then((p) => p.state, () => 'n/a')))
  .then((r) => { perm = r.join('/'); });

// --- Buttons / toggles ---
$('mode').onclick = () => {
  state.mode = state.mode === 'auto' ? 'manual' : 'auto';
  $('mode').textContent = state.mode; $('mode').classList.toggle('on', state.mode === 'manual');
};
for (const b of document.querySelectorAll('.line')) b.onclick = () => {
  state.line = +b.dataset.line;
  document.querySelectorAll('.line').forEach((x) => x.classList.toggle('on', x === b));
};

// --- Hold zones ---
for (const id of ['abL', 'abR', 'boost', 'pulse']) {
  const el = $(id), set = (v) => { state[id] = v; el.classList.toggle('on', v); };
  el.onpointerdown = (e) => { el.setPointerCapture(e.pointerId); set(true); };
  el.onpointerup = el.onpointercancel = () => set(false);
}

// --- Throttle slider (keeps value on release) ---
const thr = $('thr');
function setThrottle(e) {
  const r = thr.getBoundingClientRect();
  state.throttle = +Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height)).toFixed(3);
  $('thrFill').style.height = (state.throttle * 100) + '%';
  $('thrVal').textContent = Math.round(state.throttle * 100) + '%';
}
thr.onpointerdown = (e) => { thr.setPointerCapture(e.pointerId); setThrottle(e); };
thr.onpointermove = (e) => { if (e.buttons) setThrottle(e); };

// --- Diagnostics to the server log, 1 Hz (server prints, does not forward) ---
let lastErr = '';
window.onerror = (m) => { lastErr = String(m); };
setInterval(() => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ diag: `app:${window.appVersion || '-'} perm:${perm} started:${started} secure:${window.isSecureContext} events:${rawEvents} null:${nullEvents} tilt:${tilt.toFixed(1)} err:${lastErr} DOE:${typeof DeviceOrientationEvent} ${location.href} ${navigator.userAgent}` }));
}, 1000);

// --- Send ~30 Hz + debug readout ---
setInterval(() => {
  state.t = Date.now();
  const msg = JSON.stringify(state);
  if (ws && ws.readyState === 1) ws.send(msg);
  const d = $('dbg');
  d.classList.toggle('off', !(ws && ws.readyState === 1) || !haveOrientation);
  d.textContent = `ws:${ws && ws.readyState === 1 ? 'ok' : 'down'} orient:${haveOrientation ? 'ok' : 'none'} tilt:${tilt.toFixed(1)}° zero:${zero.toFixed(1)}°\n`
    + `app:${window.appVersion || '-'} perm:${perm} started:${started} secure:${window.isSecureContext} events:${rawEvents} null:${nullEvents} ${location.protocol}//${location.host}\n${msg}`;
}, 33);
</script>
</body>
</html>
